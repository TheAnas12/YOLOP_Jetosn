# YOLOP Configuration for Jetson Nano 2GB
# This configuration file contains optimized settings for running YOLOP on limited hardware

[System]
# Device configuration
device = cpu  # Use 'cpu' for standard Jetson Nano, 'cuda:0' if using GPU acceleration
half_precision = true  # FP16 for faster inference (if CUDA compute capability >= 7.0)
cudnn_benchmark = false  # Disable for reproducibility and lower memory usage

[Memory]
# Memory optimization for 2GB Jetson Nano
batch_size = 1  # Critical: Keep batch size at 1
pin_memory = false  # Disable to save memory
num_workers = 0  # Disable multi-worker loading to save memory
cache_images = false  # Don't cache images in memory

[Model]
# Model inference settings
img_size = 640  # Input image size (640x640 recommended)
conf_threshold = 0.25  # Object confidence threshold
iou_threshold = 0.45  # IOU threshold for NMS

[Performance]
# For Jetson Nano 2GB, typical inference times:
# ~200-400ms per frame (depending on frame rate)
# Process videos at lower resolution if needed for real-time performance:
# - 480p: ~100-150ms per frame
# - 720p: ~200-300ms per frame  
# - 1080p: ~400-600ms per frame (may be too slow for Jetson Nano 2GB)

# Recommended video preparation:
# For 30 FPS video processing:
# - Use 480p source: ~33ms target per frame (easily achievable)
# - Use 720p source: ~33ms target per frame (may need frame skipping)
# - Use 1080p source: Consider 15 FPS playback or pre-resize

[Output]
# Video output settings
output_codec = 'mp4v'  # H.264/H.265 codec (mp4v is widely compatible)
quality = 95  # Video quality (1-100), lower for faster encoding
save_with_detection = true

[Optimization Tips]
# 1. Pre-process videos on a more powerful machine if needed
# 2. Use frame skipping if real-time processing is not required
# 3. Monitor memory usage: free && top
# 4. Use TensorRT for additional acceleration (if available)
# 5. Consider quantization (INT8) for even faster inference
# 6. Reduce input resolution if necessary
# 7. Process videos sequentially to avoid memory swapping

[Jetson Nano 2GB Specifications]
# RAM: 2 GB
# GPU: 128-core NVIDIA Maxwell
# CPU: ARMv8 (4 cores @ 1.43 GHz)
# Max power: 5W
# Recommended: Run YOLOP at 480-720p resolution for stable processing

[Troubleshooting]
# Out of Memory (OOM):
# - Reduce img_size to 480 or 416
# - Set batch_size to 1 (already done)
# - Close other applications on Jetson Nano
# - Consider adding swap space: sudo fallocate -l 4G /swapfile

# Slow Processing:
# - Check if using CPU (cpu mode) vs CUDA
# - Monitor thermals: vcgencmd measure_temp
# - Reduce video resolution before processing
# - Consider frame skipping

# Model Not Found:
# - Download weights from: https://github.com/hustvl/YOLOP/releases
# - Place in: weights/End-to-end.pth
# - Check with: ls -lh weights/

